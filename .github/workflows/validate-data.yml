name: Validate game data

on:
  push:
    paths: ["Content/Data/**", "Source/Commanders/**", "Tools/validate_data.py", ".github/workflows/validate-data.yml"]
  pull_request:
    paths: ["Content/Data/**", "Source/Commanders/**", "Tools/validate_data.py", ".github/workflows/validate-data.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON data
        run: python3 Tools/validate_data.py
